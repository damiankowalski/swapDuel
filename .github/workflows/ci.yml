name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run sim -- --seconds 120
      - run: npm run build
      # Runtime dependencies only: dev tools never reach players.
      - run: npm audit --omit=dev

  # The container image as it will run on the server: builds, starts hardened, answers, runs as non-root.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t swapduel:ci .

      - name: Check the compose file
        run: SWAPDUEL_VERSION=ci TUNNEL_TOKEN=dummy docker compose -f deploy/compose.yaml config --quiet

      - name: Start it with the production hardening
        run: |
          docker run -d --name swapduel --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --user 1000:1000 --memory 256m --pids-limit 64 \
            -e HOST=0.0.0.0 -e ALLOWED_ORIGINS=http://127.0.0.1:18080 -p 127.0.0.1:18080:8080 swapduel:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/status && break; sleep 1; done

      - name: It answers, with the expected headers, as a non-root user
        run: |
          set -e
          test "$(curl -fsS http://127.0.0.1:18080/status)" = '{"state":"free","protocol":3}'
          curl -fsSI http://127.0.0.1:18080/ | grep -i "content-security-policy: default-src 'none'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/nope)" = 404
          test "$(docker exec swapduel id -u)" = 1000
          if docker exec swapduel sh -c 'command -v npm'; then echo "npm must not be in the image"; exit 1; fi
          if docker exec swapduel sh -c 'touch /tmp/x'; then echo "the file system must be read-only"; exit 1; fi

      - name: Logs
        if: always()
        run: docker logs swapduel || true
