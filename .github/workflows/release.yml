# On a version tag (vX.Y.Z), builds the server image and publishes it as ghcr.io/damiankowalski/swapduel:X.Y.Z.
# The owner creates the tag and the GitHub release; the server only ever pulls a named version (docs/DEPLOYMENT.md).
name: Release image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vX.Y.Z"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$version" || { echo "package.json version differs from the tag"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -f deploy/Dockerfile -t "ghcr.io/damiankowalski/swapduel:${{ steps.version.outputs.version }}" .

      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/damiankowalski/swapduel:${{ steps.version.outputs.version }}"
